work:
  kicker: "Selected work"
  heading: "Systems I'm proud of."
  lede: >-
    The common thread: make the failure modes visible, then engineer them away.
    Numbers are from the shipped systems, not the slide decks.
  footer_link:
    text: "Full résumé with impact bullets"
    url: "/resume/"
  items:
    - label: "Microsoft Copilot · 2023 – 2025"
      title: "Trust-first reasoning for Copilot"
      summary: >-
        Rebuilt the reasoning layer around structured templates with dynamic component
        selection, so failures became predictable and fixable instead of mysterious.
      metrics: ["CSAT 3.0 → 4.2 in 90 days", "~60% fewer critical reasoning failures"]
    - label: "Microsoft Copilot · 2023 – 2025"
      title: "Closed-loop post-training and LLM evaluators"
      summary: >-
        SFT and RL from dissatisfied real-user sessions, gated by a ~6,000-query
        regression suite and an ensemble LLM evaluator wired into CI/CD.
      metrics: ["0.89 Spearman vs blinded human study", "Validation from weeks to days", "~+30% reasoning success"]
    - label: "Azure Global Datacenter AI · 2023 – 2025"
      title: "Agentic RAG for datacenter operations"
      summary: >-
        ReAct agents over a vector store and knowledge graph, rolled out
        human-in-the-loop first and endorsed by InfoSec.
      metrics: ["+10% accuracy", "−40% human escalations", "~5x operator throughput"]
    - label: "Intelligent Machines · 2025 – now"
      title: "Inference stack on proprietary silicon"
      summary: >-
        Porting vLLM, SGLang, llama.cpp, and IREE/OpenXLA to new hardware, with a
        roadmap for hardware-accelerated KV-cache and deep-stack optimizations.
      metrics: ["~3x throughput vs GPU baseline in prototypes"]
    - label: "Amazon Go and Retail ML · 2019 – 2023"
      title: "ML and data platform for Amazon Go"
      summary: >-
        Streaming and batch processing, PB-scale image and video storage, feature
        pipelines, distributed training, and global low-latency inference, with
        guardrails so many teams could ship independently.
      metrics: ["Training from weeks to under a day", "50%+ infrastructure cost reduction"]
    - label: "Qualcomm · 2013 – 2019"
      title: "World-first 5G stack and edge AI on SoC"
      summary: >-
        Led the embedded software for a first-to-market 5G stack and multiple 4G
        products; edge inference on DSP, NPU, and mobile GPU.
      metrics: ["World-first 5G", "Edge AI on DSP / NPU / GPU"]

writing:
  kicker: "Writing"
  heading: "Notes that survived production."
  lede: >-
    Architecture, inference SLOs, evaluation, and the tradeoffs that only show up
    at scale. Long-form, with the math where it earns its place.
  footer_link:
    text: "All posts"
    url: "/posts/"

positions:
  kicker: "Positions"
  heading: "Claims I'll defend."
  lede: >-
    Short versions of arguments made at length in the posts. Each links to the
    reasoning behind it.
  items:
    - claim: "Agent loops fail on termination and context growth, not on model quality."
      post: "/posts/tool-calling-loop"
    - claim: "Batch pipelines break on queue depth, cold starts, and I/O contention long before accuracy matters."
      post: "/posts/batch-inference-slo"
    - claim: "A scaling-law fit is a planning tool with a narrow validity window. When the curve flattens, suspect data or optimization before parameters."
      post: "/posts/scaling-laws-engineering"
    - claim: "Keep batching, safety, and routing at the center of an inference service, and vendor churn at the edge."
      post: "/posts/hexagonal-ports-for-ml-services"
    - claim: "Bias–variance is a diagnostic, not a curiosity. The train/validation gap tells you which lever to pull."
      post: "/posts/bias-variance-operationalized"

