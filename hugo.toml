baseURL = "https://linjiah.github.io/"
locale = "en-us"
title = "Linjia Hu"
theme = ["github.com/adityatelange/hugo-PaperMod"]

enableRobotsTXT = true
buildDrafts = false
buildFuture = false

# Git commit dates feed .Lastmod so posts can show an "Updated" line (see
# layouts/partials/extend_post_content.html). Explicit front-matter lastmod wins.
enableGitInfo = true

[frontmatter]
lastmod = ["lastmod", ":git", "date"]

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

mainSections = ["posts", "videos"]

# English first. A Chinese edition is a second block here plus translated
# files: post.zh.md, data/home/zh.yaml, i18n/zh.yaml. See SITE_GUIDE §9.
[languages]
  [languages.en]
  languageName = "English"
  weight = 1

[pagination]
pagerSize = 10

[outputs]
home = ["HTML", "RSS"]

[module]
[[module.imports]]
path = "github.com/adityatelange/hugo-PaperMod"

# Only tags. Categories are intentionally disabled: with a handful of posts,
# one hub page per post reads as an empty archive. Re-add "category" here (and
# recreate content/categories/) once post volume justifies a second axis.
[taxonomies]
tag = "tags"

# Anchor links deep-link into the landing page sections (layouts/home.html);
# the header is sticky so they stay reachable while scrolling.
[menu]
[[menu.main]]
identifier = "work"
name = "Work"
url = "/#work"
weight = 10

[[menu.main]]
identifier = "journey"
name = "Journey"
url = "/#journey"
weight = 20

[[menu.main]]
identifier = "posts"
name = "Writing"
url = "/posts/"
weight = 30

[[menu.main]]
identifier = "community"
name = "Community"
url = "/community/"
weight = 40

[[menu.main]]
identifier = "subscribe"
name = "Subscribe"
url = "/subscribe/"
weight = 50

[[menu.main]]
identifier = "about"
name = "About"
url = "/about/"
weight = 60

# Add a "Videos" entry (url = "/videos/", weight = 35) when the first video is
# published; the landing page block and /videos/ already exist.

# The résumé is deliberately not in the nav. It is linked from the landing page
# (hero button, Work section, contact block) and from content/about.md, and
# still builds at /resume/.

[params]
env = "production"
description = "AI Architect | Principal ML Engineer — agentic AI, ML platforms, LLM post-training. Intelligent Machines; ex-Microsoft Copilot & Azure AI, Amazon, Qualcomm."
author = "Linjia Hu"
keywords = ["AI architect", "machine learning", "agentic AI", "LLM alignment", "Copilot", "Azure", "ML platforms", "edge AI", "Intelligent Machines"]
defaultTheme = "auto"
ShowReadingTime = true
ShowToc = true
TocOpen = false
ShowCodeCopyButtons = true
ShowBreadCrumbs = true
ShowPostNavLinks = true
ShowWordCount = true
ShowShareButtons = false
comments = true   # GitHub Discussions via giscus, see [params.giscus]

# Default social preview image for links shared on LinkedIn/X/Slack.
images = ["/images/og-default.jpg"]

[params.label]
text = "Linjia Hu"

[params.assets]
# PaperMod always emits all three <link rel="icon"> tags and falls back to
# favicon-16x16.png / favicon-32x32.png, so the raster sizes must exist or they
# 404. The PNGs are generated from static/favicon.svg — see design/README.md.
favicon = "/favicon.svg"
favicon16x16 = "/favicon-16x16.png"
favicon32x32 = "/favicon-32x32.png"
apple_touch_icon = "/apple-touch-icon.png"
# Safari recolours the mask icon from its alpha channel, so it needs its own
# monochrome SVG — the filled favicon would show as a solid square.
safari_pinned_tab = "/safari-pinned-tab.svg"
disableHLJS = true

# "Suggest an edit" link in every post's meta line → GitHub editor for that file.
[params.editPost]
URL = "https://github.com/linjiah/linjiah.github.io/edit/main/content"
Text = "Suggest an edit"
appendFilePath = true

[params.footer]
text = "Writing is licensed [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)"

# Email list (Buttondown). Leave username empty until the account exists; every
# subscribe block then falls back to an RSS link. Setup: SITE_GUIDE §9.
[params.newsletter]
username = ""
heading = "Get new posts and videos by email"
blurb = "About one email a month: new writing, new videos, the occasional short note. No tracking pixels, unsubscribe in one click."

# Comments are GitHub Discussions rendered by giscus. repoId is this repo's
# node id. Fill category and categoryId from https://giscus.app after enabling
# Discussions on the repository. Until then posts show a plain link. SITE_GUIDE §9.
[params.giscus]
repo = "linjiah/linjiah.github.io"
repoId = "R_kgDOSaCGiw"
category = ""
categoryId = ""
mapping = "pathname"
inputPosition = "top"
lang = "en"

# Privacy-friendly analytics. Set to your GoatCounter site code to enable.
[params.analytics]
goatcounter = ""

# Filled in when the channel exists; used by the Videos and Subscribe pages.
[params.youtube]
channel_url = ""

[[params.socialIcons]]
name = "github"
url = "https://github.com/linjiah"

[[params.socialIcons]]
name = "linkedin"
url = "https://www.linkedin.com/in/linjia-hu-4a296818/"

[[params.socialIcons]]
name = "rss"
url = "/index.xml"

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)']]

[markup.highlight]
noClasses = false
