baseURL = "https://linjiah.github.io/"
locale = "en-us"
title = "Linjia Hu"
theme = ["github.com/adityatelange/hugo-PaperMod"]

enableRobotsTXT = true
buildDrafts = false
buildFuture = false

defaultContentLanguage = "en"

mainSections = ["posts"]

[pagination]
pagerSize = 10

[outputs]
home = ["HTML", "RSS"]

[module]
[[module.imports]]
path = "github.com/adityatelange/hugo-PaperMod"

# Only tags. Categories are intentionally disabled: with a handful of posts,
# one hub page per post reads as an empty archive. Re-add "category" here (and
# recreate content/categories/) once post volume justifies a second axis.
[taxonomies]
tag = "tags"

[menu]
[[menu.main]]
identifier = "about"
name = "About"
url = "/about/"
weight = 10

[[menu.main]]
identifier = "posts"
name = "Writing"
url = "/posts/"
weight = 20

# The résumé is deliberately not in the nav: this is a writing site, not a CV.
# The page still builds at /resume/ and is linked from content/about.md.

[params]
env = "production"
description = "AI Architect | Principal ML Engineer — agentic AI, ML platforms, LLM post-training. Intelligent Machines; ex-Microsoft Copilot & Azure AI, Amazon, Qualcomm."
author = "Linjia Hu"
keywords = ["AI architect", "machine learning", "agentic AI", "LLM alignment", "Copilot", "Azure", "ML platforms", "edge AI", "Intelligent Machines"]
defaultTheme = "auto"
ShowReadingTime = true
ShowToc = true
TocOpen = false
ShowCodeCopyButtons = true
ShowBreadCrumbs = true
ShowPostNavLinks = true
ShowWordCount = true
ShowShareButtons = false
comments = false

# Default social preview image for links shared on LinkedIn/X/Slack.
images = ["/images/og-default.jpg"]

[params.label]
text = "Linjia Hu"

[params.assets]
# PaperMod always emits all three <link rel="icon"> tags and falls back to
# favicon-16x16.png / favicon-32x32.png, so the raster sizes must exist or they
# 404. The PNGs are generated from static/favicon.svg — see design/README.md.
favicon = "/favicon.svg"
favicon16x16 = "/favicon-16x16.png"
favicon32x32 = "/favicon-32x32.png"
apple_touch_icon = "/apple-touch-icon.png"
# Safari recolours the mask icon from its alpha channel, so it needs its own
# monochrome SVG — the filled favicon would show as a solid square.
safari_pinned_tab = "/safari-pinned-tab.svg"
disableHLJS = true

[[params.socialIcons]]
name = "github"
url = "https://github.com/linjiah"

[[params.socialIcons]]
name = "linkedin"
url = "https://www.linkedin.com/in/linjia-hu-4a296818/"

[[params.socialIcons]]
name = "rss"
url = "/index.xml"

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)']]

[markup.highlight]
noClasses = false
