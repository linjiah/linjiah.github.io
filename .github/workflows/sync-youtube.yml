name: Sync YouTube videos

# Creates a draft page under content/videos/ for every new upload on the channel.
# Enable it by setting the repository variable YOUTUBE_CHANNEL_ID
# (Settings → Secrets and variables → Actions → Variables). Until then it is a no-op.
# Drafts do not deploy; review, add show notes, set draft: false, push.

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nothing to do until a channel is configured
        if: ${{ vars.YOUTUBE_CHANNEL_ID == '' }}
        run: echo "::notice::Set the repository variable YOUTUBE_CHANNEL_ID to enable video syncing."

      - name: Create draft pages for new uploads
        if: ${{ vars.YOUTUBE_CHANNEL_ID != '' }}
        run: python3 scripts/sync_youtube.py --channel "${{ vars.YOUTUBE_CHANNEL_ID }}" --out content/videos

      - name: Commit drafts
        if: ${{ vars.YOUTUBE_CHANNEL_ID != '' }}
        run: |
          if [ -z "$(git status --porcelain -- content/videos)" ]; then
            echo "No new videos."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/videos
          git commit -m "videos: add drafts for new YouTube uploads"
          git push
